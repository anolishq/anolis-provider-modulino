[package]
name = "anolis-provider-modulino"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anolis-provider-sdk = { git = "https://github.com/anolishq/anolis-provider-sdk-rust", tag = "v0.1.0" }
embedded-hal = "1"
linux-embedded-hal = { version = "0.5", default-features = false, features = ["i2c"] }
modulino-driver = { git = "https://github.com/CameronBrooks11/modulino-driver", rev = "c29a0bbcb72d44f112e414c8af0bd7df1414c34e", version = "0.1.0-dev", features = ["sim"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
strip = true
